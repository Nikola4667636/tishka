{{define "base"}}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.PageTitle}} — {{.Brand}}</title>
  <meta name="description" content="ПРИЗМА — кастомные футболки, которые подбирает тест по твоему вайбу.">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body data-page="{{.Page}}">

  <!-- Декоративные иллюстрации на фоне — общие для всех страниц.
       aria-hidden для скринридеров, pointer-events: none в CSS.
       На «рабочих» страницах (quiz, print) приглушаются через body[data-page]. -->
  <div class="bg-decor" aria-hidden="true">
    <!-- carmine: скорость / авто -->
    <img class="bg-decor__item bg-decor__item--1" src="/static/images/illustrations/01_sunglasses.svg" alt="" loading="lazy">
    <img class="bg-decor__item bg-decor__item--2" src="/static/images/illustrations/03_helmet.svg" alt="" loading="lazy">
    <img class="bg-decor__item bg-decor__item--3" src="/static/images/illustrations/12_trophy.svg" alt="" loading="lazy">
    <img class="bg-decor__item bg-decor__item--4" src="/static/images/illustrations/13_number_27.svg" alt="" loading="lazy">

    <!-- indigo: культура / город -->
    <img class="bg-decor__item bg-decor__item--5" src="/static/images/illustrations/books.svg" alt="" loading="lazy">
    <img class="bg-decor__item bg-decor__item--6" src="/static/images/illustrations/cafe.svg" alt="" loading="lazy">

    <!-- зелёные: природа / отдых -->
    <img class="bg-decor__item bg-decor__item--7" src="/static/images/illustrations/21_seagull.svg" alt="" loading="lazy">
    <img class="bg-decor__item bg-decor__item--8" src="/static/images/illustrations/20_fishing_rod.svg" alt="" loading="lazy">
    <img class="bg-decor__item bg-decor__item--9" src="/static/images/illustrations/19_grill.svg" alt="" loading="lazy">

    <!-- ч/б: спорт / фитнес -->
    <img class="bg-decor__item bg-decor__item--10" src="/static/images/illustrations/fitness_02_dumbbell_b.svg" alt="" loading="lazy">
    <img class="bg-decor__item bg-decor__item--11" src="/static/images/illustrations/fitness_07_jump_rope.svg" alt="" loading="lazy">
    <img class="bg-decor__item bg-decor__item--12" src="/static/images/illustrations/sport_01_basketball.svg" alt="" loading="lazy">
    <img class="bg-decor__item bg-decor__item--13" src="/static/images/illustrations/sport_03_tennis_racket.svg" alt="" loading="lazy">
    <img class="bg-decor__item bg-decor__item--14" src="/static/images/illustrations/sport_11_hockey_stick.svg" alt="" loading="lazy">
  </div>

  <header class="site-header">
    <a class="brand" href="/" aria-label="ПРИЗМА — на главную">
      <!-- Синяя вариация логотипа — кликабельная, ведёт на главную -->
      <img class="brand-logo brand-logo--blue" src="/static/logo-blue.svg" alt="ПРИЗМА" width="220" height="72">
    </a>
    <nav class="nav">
      <a href="/">Главная</a>
      <a href="/tests">Тесты</a>
      <a href="/prints">Принты</a>
    </nav>
  </header>

  <main>
    {{template "content" .}}
  </main>

  <footer class="site-footer">
    <span><span class="brand-mini">{{.Brand}}</span> — говори о себе без слов.</span>
    <span>© {{.Brand}}</span>
  </footer>

  <script src="/static/js/app.js"></script>
  <script src="/static/js/prints.js"></script>
</body>
</html>
{{end}}
