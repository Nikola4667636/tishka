<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="ПРИЗМА">
  <defs>
    <!-- Градиент для грани-блика на треугольнике -->
    <linearGradient id="prismFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A4CB0"/>
      <stop offset="0.55" stop-color="#2C2E83"/>
      <stop offset="1" stop-color="#1F2166"/>
    </linearGradient>
    <!-- Градиент для карминового луча -->
    <linearGradient id="rayRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A60011"/>
      <stop offset="1" stop-color="#FF3B4E"/>
    </linearGradient>
    <!-- Мягкое свечение -->
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Фон-плашка -->
  <rect width="64" height="64" rx="14" fill="#2C2E83"/>

  <!-- Входящий белый луч слева -->
  <g filter="url(#softGlow)">
    <path d="M 4,30 L 24,30" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" opacity="0.95"/>
    <path d="M 6,33 L 20,33" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- Треугольник-призма: тень + основа + грань-блик -->
  <g>
    <!-- Тень под треугольником -->
    <path d="M 22,48 L 34,20 L 46,48 Z" fill="#1F2166" opacity="0.55" transform="translate(1,1.5)"/>
    <!-- Основной треугольник -->
    <path d="M 22,48 L 34,20 L 46,48 Z" fill="url(#prismFace)" stroke="#FFFFFF" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- Грань-блик (левая половина светлее) -->
    <path d="M 34,20 L 22,48 L 34,48 Z" fill="#FFFFFF" opacity="0.10"/>
    <!-- Блик-полоска вдоль левого ребра -->
    <path d="M 32,26 L 24,44" stroke="#FFFFFF" stroke-width="0.8" stroke-linecap="round" opacity="0.65"/>
  </g>

  <!-- Выходящие лучи справа: белый (верх) и карминовый (низ) -->
  <g filter="url(#softGlow)">
    <!-- Белый луч (преломление, верхний) -->
    <path d="M 44,32 L 60,26" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Карминовый луч (нижний) -->
    <path d="M 44,36 L 60,42" stroke="url(#rayRed)" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- Маленькая искра-точка в вершине (акцент) -->
  <circle cx="34" cy="20" r="1.3" fill="#FFFFFF"/>
</svg>
